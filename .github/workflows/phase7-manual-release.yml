name: Phase 7 - Manual Release

on:
  workflow_dispatch:
    inputs:
      release_reason:
        description: "Reason for controlled release validation"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-validation:
    name: Controlled release validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Discover Playwright tests
        run: npx playwright test --list

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      - name: Start local referral mock
        run: node performance/mock/referral-mock.mjs > mock.log 2>&1 &

      - name: Wait for local mock
        run: |
          for i in {1..10}; do
            curl --fail --silent http://127.0.0.1:3007/health && exit 0
            sleep 1
          done
          cat mock.log
          exit 1

      - name: Run local failure-injection tests
        run: node --test performance/mock/referral-mock.test.mjs

      - name: Run recovery performance scenario
        env:
          SCENARIO: recovery
        run: k6 run performance/k6/referral-performance.js
